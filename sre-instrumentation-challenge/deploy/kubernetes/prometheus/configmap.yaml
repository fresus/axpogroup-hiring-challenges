apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "storage-api"
        scrape_interval: 10s
        static_configs:
          - targets: ["storage-api:5000"]
